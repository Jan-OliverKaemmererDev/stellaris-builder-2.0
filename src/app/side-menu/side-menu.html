<nav
  class="drawer-menu-wrapper"
  [class.open]="isOpen"
  id="drawer-side-menu"
  aria-label="Hauptnavigation"
>
  <div class="drawer-menu-inner">
    <div class="bridge-link-wrapper">
      <a
        class="drawer-item bridge-link"
        [routerLink]="menuItems[0].route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{exact: true}"
        id="menu-bridge"
        [attr.aria-label]="menuItems[0].label"
      >
        <div class="menu-icon" [class]="menuItems[0].iconClass" aria-hidden="true"></div>
        <span class="menu-label">{{ menuItems[0].label }}</span>
      </a>
    </div>

    <div class="drawer-content">
      @for (item of menuItems.slice(1); track item.route) {
        <a
          class="drawer-item"
          [routerLink]="item.route"
          routerLinkActive="active"
          [id]="'menu-' + item.route.split('/').pop()"
          [attr.aria-label]="item.label"
        >
          <div class="menu-icon" [class]="item.iconClass" aria-hidden="true"></div>
          <span class="menu-label">{{ item.label }}</span>
        </a>
      }
    </div>
  </div>
</nav>

<div class="game-shell">
  <!-- Skip to Content Link (WCAG) -->
  <a class="skip-link" href="#main-content" aria-label="Skip to main content"
    >Zum Hauptinhalt springen</a
  >

  <!-- Side Menu -->
  <app-side-menu />

  <!-- Header Bar -->
  <header class="game-header" id="game-header" aria-label="Top bar">
    <div class="header-left"></div>

    <div class="header-right">
      <!-- Nanobots Toggle Switch -->
      @if (hasNanobots) {
        <div class="nanobots-toggle" [class.active]="settings.showNanobots()" aria-label="Toggle Nanobots Animation">
          <span class="toggle-label">Nano-Bots</span>
          <label class="switch">
            <input type="checkbox" [checked]="settings.showNanobots()" (change)="settings.toggleNanobots()">
            <span class="slider round"></span>
          </label>
        </div>
      }

      <!-- User Menu -->
      <div class="user-menu">
        <button
          class="user-avatar"
          (click)="toggleDropdown()"
          id="user-avatar-btn"
          [attr.aria-expanded]="dropdownOpen() ? 'true' : 'false'"
          aria-haspopup="true"
          aria-label="Open user menu"
        >
          {{ userInitials }}
        </button>

        @if (dropdownOpen()) {
          <div class="user-dropdown" id="user-dropdown" role="menu" aria-label="User menu">
            <header class="dropdown-header">
              <span class="dropdown-name">{{ commanderName }}</span>
            </header>
            <hr class="dropdown-divider" role="separator" />
            <a
              routerLink="/privacy-policy"
              class="dropdown-item"
              id="dropdown-privacy"
              role="menuitem"
              aria-label="Privacy Policy"
            >
              <span class="dropdown-icon" aria-hidden="true"><img src="assets/icons/lock.png" alt="Lock" style="height: 1.2em; width: auto; vertical-align: text-bottom;"></span>
              Privacy Policy
            </a>
            <a
              routerLink="/legal-notice"
              class="dropdown-item"
              id="dropdown-legal"
              role="menuitem"
              aria-label="Legal Notice"
            >
              <span class="dropdown-icon" aria-hidden="true"><img src="assets/icons/legal-notice.png" alt="" style="height: 1.2em; width: auto; vertical-align: text-bottom;"></span>
              Legal Notice
            </a>
            <hr class="dropdown-divider" role="separator" />
            <button
              class="dropdown-item logout"
              (click)="logout()"
              id="dropdown-logout"
              role="menuitem"
              aria-label="Log out"
            >
              <span class="dropdown-icon" aria-hidden="true"><img src="assets/icons/logout.png" alt="" style="height: 1.2em; width: auto; vertical-align: text-bottom;"></span>
              Logout
            </button>
          </div>
        }
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="game-content" id="main-content" aria-label="Main game content">
    <router-outlet></router-outlet>
  </main>

  <app-offline-progress-dialog></app-offline-progress-dialog>
</div>

<div class="space-background">
  <!-- Black Hole Fullscreen Background -->
  <app-black-hole></app-black-hole>

  <!-- Intro Animation Overlay -->
  <div class="intro-overlay" aria-hidden="true"></div>
  <img src="assets/logo.png" alt="Stellaris Builder Logo" class="animated-logo" />

  <!-- 3D Scene Wrapper -->
  <main class="scene" aria-label="Authentication area">
    <div class="planet" [class.is-flipped]="!isLoginMode()">


      <!-- Front Face: Login -->
      <section class="planet-face front" aria-label="Login section">
        <div class="glass-panel form-wrapper">
          <header class="logo-container">
            <h1>Stellaris <span>Builder</span></h1>
            <p class="subtitle">Erschaffe dein Sternenreich</p>
          </header>

          <form (ngSubmit)="onSubmit()" class="auth-form" aria-label="Login form">
            <h2 class="form-title">Willkommen zurück Commander</h2>

            <div *ngIf="errorMessage()" class="error-alert" role="alert" aria-live="assertive">
              {{ errorMessage() }}
            </div>

            <div *ngIf="successMessage()" class="success-alert" role="status" aria-live="polite">
              {{ successMessage() }}
            </div>

            <div class="input-group">
              <label for="email">E-Mail</label>
              <input
                #emailInput
                type="email"
                id="email"
                name="email"
                [ngModel]="email()"
                (ngModelChange)="email.set($event)"
                placeholder="commander@earth.com"
                autocomplete="email"
                aria-label="Email address"
                required
              />
            </div>

            <div class="input-group">
              <label for="password">Passwort</label>
              <div class="input-wrapper has-trailing-btn">
                <input
                  [type]="showLoginPassword() ? 'text' : 'password'"
                  id="password"
                  name="password"
                  [ngModel]="password()"
                  (ngModelChange)="password.set($event)"
                  placeholder="••••••••"
                  autocomplete="current-password"
                  aria-label="Password"
                  required
                />
                <button
                  type="button"
                  class="btn-eye-toggle"
                  (click)="toggleLoginPassword()"
                  [attr.aria-label]="showLoginPassword() ? 'Passwort verbergen' : 'Passwort anzeigen'"
                  title="Passwort ein-/ausblenden"
                >
                  @if (!showLoginPassword()) {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-svg" aria-hidden="true">
                      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                      <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                      <line x1="2" x2="22" y1="2" y2="22"/>
                    </svg>
                  } @else {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-svg" aria-hidden="true">
                      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                  }
                </button>
              </div>
            </div>

            <div class="button-group" role="group" aria-label="Login-Aktionen">
              <button type="submit" class="submit-btn primary-glow" [disabled]="isLoading()" aria-label="Log in">
                <span *ngIf="!isLoading()">Einloggen</span>
                <span *ngIf="isLoading()" class="loader" aria-label="Loading"></span>
              </button>
              <button type="button" class="submit-btn guest-btn" (click)="loginAsGuest()" [disabled]="isLoading()" aria-label="Log in as guest">
                <span *ngIf="!isLoading()">Gast</span>
                <span *ngIf="isLoading()" class="loader" aria-label="Loading"></span>
              </button>
            </div>

            <footer class="toggle-mode">
              <p>
                Noch kein Commander?
                <button type="button" class="text-btn" (click)="toggleMode()" aria-label="Switch to registration form">
                  Jetzt registrieren
                </button>
              </p>
            </footer>
          </form>
        </div>
      </section>

      <!-- Back Face: Register -->
      <section class="planet-face back" aria-label="Registration section">
        <div class="glass-panel form-wrapper">
          <header class="logo-container">
            <h1>Stellaris <span>Builder</span></h1>
            <p class="subtitle">Rekrutierungsbüro</p>
          </header>

          <form (ngSubmit)="onSubmit()" class="auth-form" aria-label="Registration form">
            <h2 class="form-title">Neuen Account erstellen</h2>

            <div *ngIf="errorMessage()" class="error-alert" role="alert" aria-live="assertive">
              {{ errorMessage() }}
            </div>

            <div *ngIf="successMessage()" class="success-alert" role="status" aria-live="polite">
              {{ successMessage() }}
            </div>

            <div class="input-group">
              <label for="commander-name">Commander Name</label>
              <input
                type="text"
                id="commander-name"
                name="commanderName"
                [ngModel]="commanderName()"
                (ngModelChange)="commanderName.set($event)"
                placeholder="Dein Name"
                autocomplete="username"
                aria-label="Commander name"
                required
              />
            </div>

            <div class="input-group">
              <label for="email-reg">E-Mail</label>
              <input
                type="email"
                id="email-reg"
                name="email"
                [ngModel]="email()"
                (ngModelChange)="email.set($event)"
                placeholder="commander@earth.com"
                autocomplete="email"
                aria-label="Email address"
                required
              />
            </div>

            <div class="input-group">
              <label for="password-reg">Passwort</label>
              <div class="input-wrapper has-trailing-btn">
                <input
                  [type]="showRegisterPassword() ? 'text' : 'password'"
                  id="password-reg"
                  name="password"
                  [ngModel]="password()"
                  (ngModelChange)="password.set($event)"
                  placeholder="••••••••"
                  autocomplete="new-password"
                  aria-label="Password"
                  required
                />
                <button
                  type="button"
                  class="btn-eye-toggle"
                  (click)="toggleRegisterPassword()"
                  [attr.aria-label]="showRegisterPassword() ? 'Passwort verbergen' : 'Passwort anzeigen'"
                  title="Passwort ein-/ausblenden"
                >
                  @if (!showRegisterPassword()) {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-svg" aria-hidden="true">
                      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                      <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                      <line x1="2" x2="22" y1="2" y2="22"/>
                    </svg>
                  } @else {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-svg" aria-hidden="true">
                      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                  }
                </button>
              </div>
            </div>

            <div class="input-group">
              <label for="confirm-password-reg">Passwort wiederholen</label>
              <div class="input-wrapper has-trailing-btn">
                <input
                  [type]="showRegisterConfirmPassword() ? 'text' : 'password'"
                  id="confirm-password-reg"
                  name="confirmPassword"
                  [ngModel]="confirmPassword()"
                  (ngModelChange)="confirmPassword.set($event)"
                  placeholder="••••••••"
                  autocomplete="new-password"
                  aria-label="Confirm Password"
                  required
                />
                <button
                  type="button"
                  class="btn-eye-toggle"
                  (click)="toggleRegisterConfirmPassword()"
                  [attr.aria-label]="showRegisterConfirmPassword() ? 'Passwort verbergen' : 'Passwort anzeigen'"
                  title="Passwort ein-/ausblenden"
                >
                  @if (!showRegisterConfirmPassword()) {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-svg" aria-hidden="true">
                      <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                      <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                      <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                      <line x1="2" x2="22" y1="2" y2="22"/>
                    </svg>
                  } @else {
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-svg" aria-hidden="true">
                      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                      <circle cx="12" cy="12" r="3"/>
                    </svg>
                  }
                </button>
              </div>
            </div>

            <div class="privacy-policy-check">
              <label>
                <input type="checkbox" name="privacyAccepted" [ngModel]="privacyAccepted()" (ngModelChange)="privacyAccepted.set($event)" aria-label="Datenschutz akzeptieren" required />
                Ich akzeptiere den <a routerLink="/privacy-policy" class="text-btn inline-link" aria-label="Datenschutz lesen">Datenschutz</a>
              </label>
            </div>

            <button type="submit" class="submit-btn primary-glow" [disabled]="isLoading() || !privacyAccepted()" aria-label="Register new account">
              <span *ngIf="!isLoading()">Registrieren</span>
              <span *ngIf="isLoading()" class="loader" aria-label="Loading"></span>
            </button>

            <footer class="toggle-mode">
              <p>
                Bereits im Dienst?
                <button type="button" class="text-btn" (click)="toggleMode()" aria-label="Switch to login form">
                  Hier einloggen
                </button>
              </p>
            </footer>
          </form>
        </div>
      </section>
    </div>
  </main>

  <footer class="landing-footer" aria-label="Site footer">
    <a routerLink="/privacy-policy" aria-label="Datenschutz">Datenschutz</a>
    <a routerLink="/legal-notice" aria-label="Impressum">Impressum</a>
  </footer>
</div>

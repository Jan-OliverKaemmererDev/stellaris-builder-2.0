<div class="overlay" *ngIf="earnings" [class.collecting]="isCollecting" role="dialog" aria-modal="true" aria-labelledby="offline-dialog-title">
  <section class="dialog" [class.collecting]="isCollecting" aria-label="Offline progress summary">
    <h2 id="offline-dialog-title">Willkommen zurück, Commander!</h2>
    <p>Während deiner Abwesenheit hat dein Imperium fleißig weiterproduziert.</p>

    <section class="resources" aria-label="Offline production earnings">
      @for (item of activeEarnings; track item.def.id) {
        <article class="resource" [attr.aria-label]="item.def.name + ' earnings'">
          <span class="icon-container" [ngClass]="item.def.id" aria-hidden="true">
            <app-icon [name]="item.def.id" size="30px" />
          </span>
          <div class="details">
            <span class="label">{{ item.def.name }}</span>
            <span class="amount">+{{ item.amount | compactNumber }}</span>
          </div>
        </article>
      }
    </section>

    <button (click)="close()" aria-label="Close dialog">Einsammeln</button>
  </section>
</div>

@if (data) {
  <div class="image-lightbox-overlay" (click)="closed.emit()" role="dialog" aria-modal="true" [attr.aria-label]="data.title + ' Details'">
    <div class="lightbox-wrapper" (click)="$event.stopPropagation()">
      <section class="lightbox-content" aria-labelledby="lightbox-title">
        <button class="close-btn" (click)="closed.emit()" aria-label="Dialog schließen">
          <img src="assets/icons/close.png" alt="" aria-hidden="true" />
        </button>

        <!-- Title above the image -->
        <h2 id="lightbox-title" class="lightbox-title">{{ data.title }}</h2>

        <!-- Enlarged image -->
        @if (data.imagePath.startsWith('css-icon-')) {
          <app-icon [name]="data.imagePath" size="200px" style="margin: 0 auto; display: block;" />
        } @else {
          <img [src]="data.imagePath" [alt]="data.title" class="lightbox-image" />
        }

        <!-- Description & dynamic effect below the image -->
        <div class="lightbox-info">
          <p class="lightbox-description">{{ data.description }}</p>
          @if (data.effectText) {
            <p class="lightbox-effect">{{ data.effectText }}</p>
          }
        </div>
      </section>
    </div>
  </div>
}

<app-nano-bots-overlay></app-nano-bots-overlay>
<section class="mining-container" aria-labelledby="mining-heading">
  <h1 class="page-title" id="mining-heading">Rohstoffabbau</h1>

  <div class="mines-list" role="list" aria-label="Mines list">
    @for (mine of mines; track mine.id) {
      <div class="mine-row" role="listitem">
        <!-- Mine Node -->
        <app-skill-node
          [title]="mine.title"
          [imagePath]="mine.imagePath"
          [level]="getSkillLevel(mine.id)"
          [locked]="!isMineUnlocked(mine)"
          [lockText]="
            'Benötigt ' + (mine.requiredNode?.id ?? '') + ' Lvl ' + (mine.requiredNode?.level ?? '')
          "
          [effectText]="mine.effectFn(getSkillLevel(mine.id), gameState.skills())"
          [costEntries]="
            getCostEntries(
              getCurrentCost(mine.baseCost, mine.costMultiplier, getSkillLevel(mine.id))
            )
          "
          [canAfford]="
            canAfford(getCurrentCost(mine.baseCost, mine.costMultiplier, getSkillLevel(mine.id)))
          "
          [activeBuild]="gameState.activeBuilds()[mine.id]"
          (imageClicked)="openMineLightbox(mine)"
          (buildStarted)="
            startBuild(
              mine.id,
              getCurrentCost(mine.baseCost, mine.costMultiplier, getSkillLevel(mine.id)),
              30000 + (getSkillLevel(mine.id) * 10000)
            )
          "
          (upgradeCompleted)="completeBuild(mine.id)"
        />

        <!-- Upgrades Section -->
        <div
          class="mine-upgrades-section"
          role="list"
          [attr.aria-label]="'Upgrades for ' + mine.title"
        >
          @for (upgrade of mine.upgrades; track upgrade.id) {
            <!-- Connector Line -->
            <span
              class="skill-connector"
              [class.unlocked]="isUpgradeUnlocked(mine.id, upgrade)"
              aria-hidden="true"
            ></span>

            <app-skill-node
              [title]="upgrade.title"
              [imagePath]="upgrade.imagePath"
              [level]="getSkillLevel(upgrade.id)"
              [locked]="!isUpgradeUnlocked(mine.id, upgrade)"
              [lockText]="mine.title + ' Lvl ' + upgrade.requiredMineLevel"
              [effectText]="upgrade.effectFn(getSkillLevel(upgrade.id))"
              [costEntries]="
                getCostEntries(
                  getCurrentCost(
                    upgrade.baseCost,
                    upgrade.costMultiplier,
                    getSkillLevel(upgrade.id)
                  )
                )
              "
              [canAfford]="
                canAfford(
                  getCurrentCost(
                    upgrade.baseCost,
                    upgrade.costMultiplier,
                    getSkillLevel(upgrade.id)
                  )
                )
              "
              [activeBuild]="gameState.activeBuilds()[upgrade.id]"
              (imageClicked)="openUpgradeLightbox(upgrade)"
              (buildStarted)="
                startBuild(
                  upgrade.id,
                  getCurrentCost(
                    upgrade.baseCost,
                    upgrade.costMultiplier,
                    getSkillLevel(upgrade.id)
                  ),
                  30000 + (getSkillLevel(upgrade.id) * 10000)
                )
              "
              (upgradeCompleted)="completeBuild(upgrade.id)"
            />
          }
        </div>
      </div>
    }
  </div>

  <app-lightbox [data]="selectedLightbox" (closed)="closeLightbox()" />
</section>

<app-nano-bots-overlay></app-nano-bots-overlay>
<section class="research-container" aria-labelledby="research-heading">
  <h1 class="page-title" id="research-heading">Forschungszentrum</h1>

  <div class="buildings-list" role="list" aria-label="Technology list">
    @for (item of items; track item.id) {
      <div class="building-row" role="listitem">
        <!-- Main Node -->
        <app-skill-node
          [title]="item.title"
          [imagePath]="item.imagePath"
          [level]="getSkillLevel(item.id)"
          [locked]="!isUnlocked(item)"
          [lockText]="
            'Benötigt ' + (item.requiredNode?.id ?? '') + ' Lvl ' + (item.requiredNode?.level ?? '')
          "
          [effectText]="item.effectFn(getSkillLevel(item.id))"
          [costEntries]="
            getCostEntries(
              getCurrentCost(item.baseCost, item.costMultiplier, getSkillLevel(item.id))
            )
          "
          [canAfford]="
            canAfford(getCurrentCost(item.baseCost, item.costMultiplier, getSkillLevel(item.id)))
          "
          [buttonText]="'Erforschen'"
          (imageClicked)="openLightbox(item)"
          (upgradeClicked)="
            upgradeSkill(
              item.id,
              getCurrentCost(item.baseCost, item.costMultiplier, getSkillLevel(item.id))
            )
          "
        />

        <!-- Upgrades Section -->
        <div
          class="building-upgrades-section"
          role="list"
          [attr.aria-label]="'Upgrades for ' + item.title"
        >
          @for (upgrade of item.upgrades; track upgrade.id) {
            <!-- Connector Line -->
            <span
              class="skill-connector"
              [class.unlocked]="isUpgradeUnlocked(item.id, upgrade)"
              aria-hidden="true"
            ></span>

            <app-skill-node
              [title]="upgrade.title"
              [imagePath]="upgrade.imagePath"
              [level]="getSkillLevel(upgrade.id)"
              [locked]="!isUpgradeUnlocked(item.id, upgrade)"
              [lockText]="item.title + ' Lvl ' + upgrade.requiredLevel"
              [effectText]="upgrade.effectFn(getSkillLevel(upgrade.id))"
              [costEntries]="
                getCostEntries(
                  getCurrentCost(
                    upgrade.baseCost,
                    upgrade.costMultiplier,
                    getSkillLevel(upgrade.id)
                  )
                )
              "
              [canAfford]="
                canAfford(
                  getCurrentCost(
                    upgrade.baseCost,
                    upgrade.costMultiplier,
                    getSkillLevel(upgrade.id)
                  )
                )
              "
              [buttonText]="'Ausbauen'"
              [showPlaceholder]="true"
              [placeholderChar]="upgrade.title.charAt(0)"
              (imageClicked)="openLightbox(upgrade)"
              (upgradeClicked)="
                upgradeSkill(
                  upgrade.id,
                  getCurrentCost(
                    upgrade.baseCost,
                    upgrade.costMultiplier,
                    getSkillLevel(upgrade.id)
                  )
                )
              "
            />
          }
        </div>
      </div>
    }
  </div>

  <app-lightbox [data]="selectedLightbox" (closed)="closeLightbox()" />
</section>

<app-nano-bots-overlay></app-nano-bots-overlay>
<section class="trade-container" aria-label="Handel & Wirtschaft">

  <div class="buildings-list" role="list" aria-label="Economy buildings list">
    @for (item of items; track item.id) {
      <div class="building-row-wrapper"><div class="building-row" role="listitem" appDragScroll>
        <!-- Main Node -->
        <app-skill-node
          [title]="item.title"
          [imagePath]="item.imagePath"
          [level]="getSkillLevel(item.id)"
          [locked]="!isUnlocked(item)"
          [lockText]="getBuildingLockText(item)"
          [effectText]="item.effectFn(getSkillLevel(item.id), gameState.skills())"
          [costEntries]="
            getCostEntries(
              getCurrentCost(item.baseCost, item.costMultiplier, getSkillLevel(item.id))
            )
          "
          [energyDelta]="getEnergyDelta(item.id)"
          [isDeactivated]="gameState.isDeactivated(item.id)"
          [canTogglePower]="getSkillLevel(item.id) > 0"
          (powerToggled)="gameState.togglePower(item.id)"
          [canAfford]="
            canAfford(getCurrentCost(item.baseCost, item.costMultiplier, getSkillLevel(item.id)))
          "
          [activeBuild]="gameState.activeBuilds()[item.id]"
          (imageClicked)="openLightbox(item)"
          (buildStarted)="
            startBuild(
              item.id,
              getCurrentCost(item.baseCost, item.costMultiplier, getSkillLevel(item.id)),
              30000 + (getSkillLevel(item.id) * 10000)
            )
          "
          (upgradeCompleted)="completeBuild(item.id)"
        />

        <!-- Upgrades Section -->
        <div
          class="building-upgrades-section"
          role="list"
          [attr.aria-label]="'Upgrades for ' + item.title"
        >
          @for (upgrade of item.upgrades; track upgrade.id; let idx = $index) {
            <!-- Connector Line -->
            <span
              class="skill-connector"
              [class.unlocked]="isUpgradeUnlocked(item, idx)"
              aria-hidden="true"
            ></span>

            <app-skill-node
              [title]="upgrade.title"
              [imagePath]="upgrade.imagePath"
              [level]="getSkillLevel(upgrade.id)"
              [locked]="!isUpgradeUnlocked(item, idx)"
              [lockText]="getUpgradeLockText(item, idx)"
              [effectText]="upgrade.effectFn(getSkillLevel(upgrade.id))"
              [costEntries]="
                getCostEntries(
                  getCurrentCost(
                    upgrade.baseCost,
                    upgrade.costMultiplier,
                    getSkillLevel(upgrade.id)
                  )
                )
              "
              [canAfford]="
                canAfford(
                  getCurrentCost(
                    upgrade.baseCost,
                    upgrade.costMultiplier,
                    getSkillLevel(upgrade.id)
                  )
                )
              "
              [buttonText]="'Ausbauen'"
              [activeBuild]="gameState.activeBuilds()[upgrade.id]"
              (imageClicked)="openLightbox(upgrade)"
              (buildStarted)="
                startBuild(
                  upgrade.id,
                  getCurrentCost(
                    upgrade.baseCost,
                    upgrade.costMultiplier,
                    getSkillLevel(upgrade.id)
                  ),
                  30000 + (getSkillLevel(upgrade.id) * 10000)
                )
              "
              (upgradeCompleted)="completeBuild(upgrade.id)"
            />
          }
        </div>
      </div></div>
    }
  </div>

  <app-lightbox [data]="selectedLightbox" (closed)="closeLightbox()" />
</section>

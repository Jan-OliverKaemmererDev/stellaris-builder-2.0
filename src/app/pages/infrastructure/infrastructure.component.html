<app-nano-bots-overlay></app-nano-bots-overlay>
<section class="infrastructure-container" aria-labelledby="infrastructure-heading">
  <h1 class="page-title" id="infrastructure-heading">Infrastruktur</h1>

  <div class="buildings-list" role="list" aria-label="Buildings list">
    @for (building of buildings; track building.id) {
      <div class="building-row" role="listitem">
        
        <!-- Building Node -->
        <app-skill-node
          [title]="building.title"
          [imagePath]="building.imagePath"
          [level]="getSkillLevel(building.id)"
          [locked]="!isBuildingUnlocked(building)"
          [lockText]="'Benötigt ' + (building.requiredNode?.id ?? '') + ' Lvl ' + (building.requiredNode?.level ?? '')"
          [effectText]="building.effectFn(getSkillLevel(building.id))"
          [costEntries]="getCostEntries(getCurrentCost(building.baseCost, building.costMultiplier, getSkillLevel(building.id)))"
          [canAfford]="canAfford(getCurrentCost(building.baseCost, building.costMultiplier, getSkillLevel(building.id)))"
          [buttonText]="'Ausbauen'"
          [activeBuild]="gameState.activeBuilds()[building.id]"
          (imageClicked)="openLightbox(building)"
          (buildStarted)="startBuild(building.id, getCurrentCost(building.baseCost, building.costMultiplier, getSkillLevel(building.id)), 30000 + (getSkillLevel(building.id) * 10000))"
          (upgradeCompleted)="completeBuild(building.id)"
        />

        <!-- Upgrades Section -->
        <div class="building-upgrades-section" role="list" [attr.aria-label]="'Upgrades for ' + building.title">
          @for (upgrade of building.upgrades; track upgrade.id) {
            
            <!-- Connector Line -->
            <span class="skill-connector" [class.unlocked]="isUpgradeUnlocked(building.id, upgrade)" aria-hidden="true"></span>

            <app-skill-node
              [title]="upgrade.title"
              [imagePath]="upgrade.imagePath"
              [level]="getSkillLevel(upgrade.id)"
              [locked]="!isUpgradeUnlocked(building.id, upgrade)"
              [lockText]="building.title + ' Lvl ' + upgrade.requiredBuildingLevel"
              [effectText]="upgrade.effectFn(getSkillLevel(upgrade.id))"
              [costEntries]="getCostEntries(getCurrentCost(upgrade.baseCost, upgrade.costMultiplier, getSkillLevel(upgrade.id)))"
              [canAfford]="canAfford(getCurrentCost(upgrade.baseCost, upgrade.costMultiplier, getSkillLevel(upgrade.id)))"
              [buttonText]="'Kaufen'"
              [activeBuild]="gameState.activeBuilds()[upgrade.id]"
              (imageClicked)="openLightbox(upgrade)"
              (buildStarted)="startBuild(upgrade.id, getCurrentCost(upgrade.baseCost, upgrade.costMultiplier, getSkillLevel(upgrade.id)), 30000 + (getSkillLevel(upgrade.id) * 10000))"
              (upgradeCompleted)="completeBuild(upgrade.id)"
            />

          }
        </div>

      </div>
    }
  </div>

  <app-lightbox [data]="selectedLightbox" (closed)="closeLightbox()" />
</section>
